<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의하기 · 좋은인재연구소</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#ffffff; --bg-soft:#f7f6f3; --border:#e9e9e7; --border-strong:#dbdad5;
    --accent:#2383e2; --accent-dark:#1a6dc4; --text-main:#37352f; --text-sub:#7c7b76; --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; color:var(--text-main); background:var(--bg); line-height:1.6;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 24px;}

  header{position:sticky; top:0; z-index:50; background:rgba(255,255,255,0.94); border-bottom:1px solid var(--border);}
  header .wrap{display:flex; align-items:center; justify-content:space-between; height:72px;}
  .logo{font-size:18px; font-weight:700; letter-spacing:-0.01em;}
  nav{display:flex; gap:32px;}
  nav a{font-size:14px; color:var(--text-sub); transition:color .15s;}
  nav a:hover{color:var(--text-main);}
  nav a.active{color:var(--accent); font-weight:600;}
  .header-actions{display:flex; gap:10px; align-items:center;}
  .btn{display:inline-flex; align-items:center; justify-content:center; padding:9px 18px; border-radius:7px; font-size:14px; font-weight:600; border:1px solid var(--border-strong); cursor:pointer; transition:background .15s, border-color .15s;}
  .btn-ghost{background:#fff; color:var(--text-main);}
  .btn-ghost:hover{background:var(--bg-soft);}
  .btn-primary{background:var(--accent); border:1px solid var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-dark); border-color:var(--accent-dark);}
  .mnav-toggle{display:none;}
  .hamburger{display:none; flex-direction:column; gap:5px; cursor:pointer; padding:6px; background:none; border:0;}
  .hamburger span{display:block; width:22px; height:2px; background:var(--text-main); transition:transform .25s, opacity .2s;}

  .page-head{padding:64px 0 8px; text-align:center;}
  .page-head h1{font-size:30px; font-weight:700; letter-spacing:-0.01em; margin-bottom:10px;}
  .page-head p{font-size:15px; color:var(--text-sub); max-width:520px; margin:0 auto;}

  .contact-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; padding:48px 0 100px; max-width:720px; margin:0 auto;}
  .contact-card{border:1px solid var(--border); border-radius:var(--radius); padding:32px 24px; text-align:center;}
  .contact-card .label{font-size:12px; color:var(--text-sub); margin-bottom:8px;}
  .contact-card .value{font-size:17px; font-weight:700; margin-bottom:18px; word-break:break-all;}
  @media (max-width:620px){ .contact-grid{grid-template-columns:1fr;} }

  footer{border-top:1px solid var(--border); padding:56px 0 36px; background:var(--bg-soft);}
  .footer-company{font-size:13px; color:var(--text-sub); line-height:1.9;}
  .footer-company strong{color:var(--text-main); font-size:14px;}

  @media (max-width:860px){
    .hamburger{display:flex;}
    nav{
      display:flex; flex-direction:column; gap:0;
      position:fixed; top:72px; left:0; right:0;
      background:#fff; border-bottom:1px solid var(--border);
      max-height:0; overflow:hidden;
      transition:max-height .25s ease;
    }
    nav a{padding:14px 24px; border-top:1px solid var(--border); font-size:15px;}
    .mnav-toggle:checked ~ nav{max-height:320px;}
    .mnav-toggle:checked ~ .hamburger span:nth-child(1){transform:translateY(7px) rotate(45deg);}
    .mnav-toggle:checked ~ .hamburger span:nth-child(2){opacity:0;}
    .mnav-toggle:checked ~ .hamburger span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="index.html">좋은인재연구소</a>
    <input type="checkbox" id="mnav" class="mnav-toggle">
    <nav>
      <a href="index.html">메인</a>
      <a href="services.html">서비스소개</a>
      <a href="team.html">팀소개</a>
      <a href="contact.html" class="active">문의하기</a>
    </nav>
    <label class="hamburger" for="mnav" aria-label="메뉴 열기"><span></span><span></span><span></span></label>
  </div>
</header>

<section class="page-head">
  <div class="wrap">
    <!-- ✏️ 수정: 페이지 타이틀 / 부제목 -->
    <h1>여러분의 HR을 도와드리겠습니다</h1>
    <p>좋은인재연구소는 맞춤형 서비스를 제공합니다</p>
    <p>문의사항이 있으시면 편하게 메일 또는 카카오톡으로 연락주세요</p>
  </div>
</section>

<div class="wrap">
  <!-- ✏️ 수정: 이메일 주소 / 카카오채널 링크 -->
  <div class="contact-grid">
    <div class="contact-card">
      <div class="label">EMAIL</div>
      <div class="value">goodhrlab@gmail.com</div>
      <a href="mailto:[goodhrlab@gmail.com]" class="btn btn-primary">이메일 보내기</a>
    </div>
    <div class="contact-card">
      <div class="label">KAKAO CHANNEL</div>
      <div class="value">좋은인재연구소 카카오톡</div>
      <a href="https://open.kakao.com/o/sK9PIzci" class="btn btn-primary">카카오채널 문의</a>
    </div>
  </div>
</div>
<!-- ✏️ 참고: 카카오채널 버튼의 href="#"를 채널 URL로, mailto:[이메일주소]를 실제 이메일로 바꿔주세요. -->

<footer>
  <div class="wrap">
    <div class="footer-company">
      <strong>좋은인재연구소</strong><br>
      경기도 용인시 수지구 용구대로2790번길 7, 302-S315호(죽전동)<br>
      대표 김진 · 사업자등록번호 893-09-03270<br>
    </div>
  </div>
</footer>

</body>
</html>
